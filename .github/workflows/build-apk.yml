name: Build Mahtab VIP Salon APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      # 1. دریافت پروژه
      - name: Checkout project
        uses: actions/checkout@v6

      # 2. نصب Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. آماده‌سازی Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. نصب دقیق SDK موردنیاز Capacitor
      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      # 5. نصب Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 6. نصب وابستگی‌های پروژه
      - name: Install dependencies
        run: npm ci

      # 7. ساخت نسخه Web
      - name: Build web app
        run: npm run build

      # 8. انتقال فایل‌های Web به Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 9. ساخت APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 10. ذخیره APK به عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahtab-vip-salon-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
